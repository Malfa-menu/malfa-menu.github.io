<style>
/* ==========================================================
   ملفى — Malfa Coffee House · قائمة الحلويات
   ألوان الهوية: #F15B27 · #282828 · #70CDDD
   ========================================================== */
:root{
  --bone:#F6EEE4; --bone-2:#EDE2D3;
  --ink:#282828; --ink-64:rgba(40,40,40,.64); --ink-40:rgba(40,40,40,.40);
  --ember:#F15B27; --glacier:#70CDDD; --gold:#C09A2C; --line:rgba(40,40,40,.13);
  --ar-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --ar-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --en-display:"Poppins",system-ui,sans-serif;
  --pad:clamp(1.15rem,5vw,4.5rem);
  --ease:cubic-bezier(.22,.61,.36,1);
  --swing:cubic-bezier(.65,.02,.18,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bone);color:var(--ink);
  font-family:var(--ar-body);font-size:16px;line-height:1.65;
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--ember);outline-offset:3px;border-radius:2px}
svg.mark{width:100%;height:auto;display:block;fill:currentColor}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ================= حركات عامة ================= */
/* الحركات تعمل فقط إذا أضاف الجافاسكربت الصنف anim — بدونها كل شيء ظاهر افتراضياً */
.anim .rv{opacity:0;transform:translateY(22px);
  transition:opacity .75s var(--ease) var(--d,0s), transform .75s var(--ease) var(--d,0s)}
.anim .rv.in{opacity:1;transform:none}
.lift{display:block;overflow:hidden}
.anim .lift>span{display:block;transform:translateY(110%);
  transition:transform .85s var(--swing) var(--d,0s)}
.anim .lift.in>span{transform:none}

/* ================= الهيرو — الشعار وحده ================= */
.hero{position:relative;height:132vh;height:132svh;min-height:660px}
.hero__mark{position:sticky;top:0;height:100vh;height:100svh;display:grid;place-content:center;
  justify-items:center;gap:1.15rem;text-align:center;padding-inline:var(--pad);
  will-change:transform,opacity}
.hero__mono{width:34px;color:var(--ember);opacity:0;transform:scale(.6) rotate(-25deg);
  animation:pop .6s var(--ease) .15s forwards}
.hero__word{width:min(68vw,420px);color:var(--ink);margin:0;
  opacity:0;clip-path:inset(0 100% 0 0);animation:wipe .95s var(--swing) .45s forwards}
.hero__sub{font-family:var(--en-display);font-weight:600;font-size:clamp(.78rem,3vw,1rem);
  color:var(--ink-64);direction:ltr;opacity:0;animation:fadein .9s ease 1.05s forwards}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes wipe{to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes fadein{to{opacity:1}}
.hero__cue{margin-top:1.1rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;
  padding:.55rem 1rem;border-radius:999px;color:var(--ink-64);
  opacity:0;animation:fadein .8s ease 1.4s forwards;transition:color .25s}
.hero__cue svg{width:22px;height:22px;display:block;stroke:var(--ember);fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  animation:swipedown 2s var(--ease) infinite}
.hero__cue span{font-size:.74rem;font-weight:500;white-space:nowrap}
.hero__cue:hover{color:var(--ink)}
.hero__cue:active{transform:scale(.94)}
@keyframes swipedown{
  0%{transform:translateY(-9px);opacity:0}
  30%{transform:translateY(-2px);opacity:1}
  70%{transform:translateY(6px);opacity:1}
  100%{transform:translateY(11px);opacity:0}}

/* ================= الشريط اللاصق ================= */
.rail{position:sticky;top:0;z-index:40;background:rgba(246,238,228,.93);
  border-block:1px solid var(--line);display:flex;align-items:center;gap:.5rem;
  padding:.45rem var(--pad)}
@supports (backdrop-filter:blur(6px)){.rail{backdrop-filter:blur(12px)}}
.rail__mono{width:19px;flex:none;color:var(--ink);opacity:.85;
  transition:transform .7s var(--swing),color .4s}
.rail.moving .rail__mono{transform:rotate(90deg);color:var(--ember)}
.rail__wrap{position:relative;flex:1;min-width:0}
.rail__chips{position:relative;display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.rail__chips::-webkit-scrollbar{display:none}
.pillbg{position:absolute;left:0;top:0;height:100%;width:0;border-radius:999px;
  background:var(--ink);pointer-events:none;
  transition:transform .55s var(--swing),width .55s var(--swing)}
.chip{flex:none;scroll-snap-align:center;padding:.62rem 1.05rem;border-radius:999px;
  font-size:.92rem;font-weight:500;color:var(--ink-64);white-space:nowrap;
  position:relative;z-index:2;transition:color .35s var(--ease),transform .2s}
.chip[aria-current="true"]{color:var(--bone)}
.chip:active{transform:scale(.94)}
.lang{flex:none;display:flex;align-items:center;gap:.15rem;border:1px solid var(--line);
  border-radius:999px;padding:.2rem;font-family:var(--en-display);font-size:.78rem;font-weight:600}
.lang button{min-width:44px;min-height:40px;padding:0 .5rem;border-radius:999px;line-height:1;
  display:flex;align-items:center;justify-content:center;color:var(--ink-64);
  transition:.35s var(--ease)}
.lang button.on{background:var(--ember);color:#fff}
.lang button:active{transform:scale(.92)}
.prog{position:absolute;bottom:-1px;left:0;height:2px;width:100%;
  background:var(--ember);transform:scaleX(0);transform-origin:right;will-change:transform}
html[dir="ltr"] .prog{transform-origin:left}

/* ================= الأقسام ================= */
#menu{transition:opacity .26s ease,transform .26s ease}
#menu.swap{opacity:0;transform:translateY(10px)}
.sec{padding:clamp(3.2rem,11vw,7rem) 0 0;scroll-margin-top:60px}
.sec--bare{padding-top:clamp(2.2rem,8vw,4.5rem)}
.sec__head{padding-inline:var(--pad);margin-bottom:clamp(1.6rem,5vw,2.6rem)}
.sec__row{display:flex;align-items:baseline;gap:.9rem}
.sec__title{margin:0;font-family:var(--ar-display);font-weight:700;
  font-size:clamp(1.7rem,7vw,3.2rem);line-height:1.08;letter-spacing:-.01em}
html[lang="en"] .sec__title{font-family:var(--en-display);letter-spacing:-.02em}
.sec__count{font-family:var(--en-display);font-weight:600;font-size:.75rem;color:var(--ember);direction:ltr}
.sec__line{margin:.5rem 0 0;font-size:.98rem;color:var(--ink-64);max-width:38ch}

/* ================= الأصناف — شبكة منتظمة ================= */
.grid-items{display:grid;grid-template-columns:repeat(2,1fr);
  gap:clamp(.9rem,3.5vw,1.5rem) clamp(.8rem,3vw,1.3rem);padding-inline:var(--pad)}
@media (min-width:700px){.grid-items{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.grid-items{grid-template-columns:repeat(4,1fr);gap:2rem 1.6rem}}

.item{display:flex;flex-direction:column;width:100%;text-align:start;margin:0}
.item__fig{margin:0;overflow:hidden;border-radius:12px;background:var(--bone-2);aspect-ratio:4/5}
.item__fig img{width:100%;height:100%;object-fit:cover}
@supports not (aspect-ratio:1/1){
  .item__fig{height:0;padding-bottom:125%;position:relative}
  .item__fig img{position:absolute;inset:0}
}

.item__meta{padding-top:.78rem}
.item__name{margin:0;font-family:var(--ar-display);font-weight:700;
  font-size:clamp(.98rem,3.9vw,1.15rem);line-height:1.35}
html[lang="en"] .item__name{font-family:var(--en-display);font-weight:600;letter-spacing:-.01em}
.item__desc{margin:.3rem 0 0;font-size:.82rem;line-height:1.5;color:var(--ink-64);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item__foot{margin-top:.6rem;display:flex;align-items:baseline;gap:.6rem;direction:ltr;
  flex-wrap:wrap}
.price{font-family:var(--en-display);font-weight:700;color:var(--ember);
  font-size:clamp(1rem,4.1vw,1.25rem);line-height:1;letter-spacing:-.02em}
.price i{font-style:normal;font-size:.52em;font-weight:600;margin-inline-start:.26em}
.kcal{font-family:var(--en-display);font-size:.7rem;font-weight:500;color:var(--ink-40)}
.flag{display:inline-block;margin-inline-end:.4rem;padding:.18rem .5rem;border-radius:999px;
  font-size:.62rem;font-weight:600;background:var(--ember);color:#fff;vertical-align:.18em}
.flag--cool{background:var(--glacier);color:var(--ink)}

/* صنف وحيد في قسمه — يمتد بعرض الشبكة */
.item:only-child{grid-column:1/-1}
.item:only-child .item__fig{aspect-ratio:16/10}
@supports not (aspect-ratio:1/1){.item:only-child .item__fig{padding-bottom:62.5%}}

/* صنف معلّم "كاملة" — الصورة تظهر بنسبتها الأصلية بلا أي قص */
.item--full .item__fig,
.item:only-child.item--full .item__fig{aspect-ratio:auto;height:auto;padding-bottom:0;
  background:none;border-radius:0;overflow:visible}
/* الصورة نفسها محفوظة بحواف متلاشية (WebP بقناة شفافية) */
.item--full .item__fig img{position:static;object-fit:contain;
  width:auto;height:auto;max-width:100%;max-height:min(42vh,300px);margin-inline:auto}
.item:only-child .item__name{font-size:clamp(1.2rem,5vw,1.6rem)}
.item:only-child .item__desc{-webkit-line-clamp:3;font-size:.9rem}
@media (min-width:700px){
  .item:only-child{display:grid;grid-template-columns:1.1fr 1fr;
    gap:clamp(1.4rem,4vw,3rem);align-items:center}
  .item:only-child .item__fig{aspect-ratio:4/3}
  @supports not (aspect-ratio:1/1){.item:only-child .item__fig{padding-bottom:75%}}
  .item:only-child.item--full .item__fig{aspect-ratio:auto;padding-bottom:0}
  .item:only-child.item--full .item__fig img{max-height:min(48vh,400px)}
  .item:only-child .item__meta{padding-top:0}
  .item:only-child .item__name{font-size:clamp(1.5rem,3vw,2.1rem)}
  .item:only-child .item__desc{font-size:.98rem}
}

/* ================= المشروبات — قائمة نصية ================= */
.drinks{padding-inline:var(--pad);display:grid;gap:clamp(2.1rem,7vw,3rem);align-content:start}
.dgroup__t{margin:0 0 .5rem;font-family:var(--ar-display);font-weight:700;
  font-size:clamp(1.05rem,4.3vw,1.4rem);line-height:1.3}
html[lang="en"] .dgroup__t{font-family:var(--en-display);font-weight:600;letter-spacing:-.01em}
.dgroup__t::after{content:"";display:block;width:26px;height:2px;background:var(--ember);
  margin-top:.5rem}
.drow{display:flex;align-items:baseline;gap:.6rem;padding:.66rem 0;
  border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow__n{font-size:1rem;font-weight:500;flex:1;min-width:0}
.drow__k{font-family:var(--en-display);font-size:.66rem;font-weight:500;color:var(--ink-40);
  margin-inline-start:.45rem;white-space:nowrap;direction:ltr}
.drow__p{font-family:var(--en-display);font-weight:700;color:var(--ember);
  font-size:1.08rem;direction:ltr;white-space:nowrap;letter-spacing:-.01em}
.drow__p i{font-style:normal;font-size:.6em;font-weight:600;margin-inline-start:.22em}
@media (min-width:900px){
  .drinks{grid-template-columns:1fr 1fr;column-gap:clamp(3rem,8vw,7rem)}
  .drow__n{font-size:1.05rem}
}


/* ================= القسم الموسمي — لوح مميّز ================= */
.sec--panel .grid-items{margin-inline:var(--pad);
  padding:clamp(1.6rem,5vw,3rem) clamp(1.2rem,4vw,2.6rem);border-radius:26px;
  background:linear-gradient(155deg,#EDE0CD,#E7D8C4 58%,#E3D3BE);
  position:relative;overflow:hidden}
.sec--panel .grid-items::before{content:"";position:absolute;inset-block-start:-18%;inset-inline-end:-12%;
  width:46%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none}
.sec--panel .item{position:relative;z-index:1}
.sec--panel .item--full .item__fig img{max-height:min(50vh,400px)}
.sec--panel .item__meta{padding-top:1.1rem}
.sec--panel .item__name{font-size:clamp(1.55rem,6.4vw,2.1rem);line-height:1.25}
.sec--panel .item__desc{font-size:1rem;-webkit-line-clamp:4}
.sec--panel .price{font-size:clamp(1.5rem,6vw,2rem)}
.sec--panel .flag{font-size:.7rem;padding:.26rem .7rem}
@media (min-width:700px){
  .sec--panel .item:only-child{grid-template-columns:1.05fr .95fr;gap:clamp(2rem,5vw,4rem)}
  .sec--panel .item--full .item__fig img{max-height:min(56vh,460px)}
  .sec--panel .item__name{font-size:clamp(2rem,3.6vw,2.9rem)}
  .sec--panel .item__desc{font-size:1.08rem;max-width:34ch}
  .sec--panel .price{font-size:clamp(2rem,3vw,2.6rem)}
}

/* ================= كروت المحاصيل ================= */
.beans{display:flex;gap:clamp(.8rem,3vw,1.4rem);overflow-x:auto;scroll-snap-type:x mandatory;
  padding-inline:var(--pad);padding-bottom:.8rem;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.beans::-webkit-scrollbar{display:none}
.bean{flex:none;scroll-snap-align:center;width:min(84vw,330px);position:relative;
  background:#FFFCF7;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  padding:1.4rem 1.2rem 1.25rem;display:flex;flex-direction:column}
.bean::before{content:"";position:absolute;inset-block-start:0;inset-inline:0;height:3px;
  background:var(--ember)}
.bean--decaf::before{background:var(--glacier)}
.bean--premium::before{background:var(--gold)}
.bean--premium .bean__mono{color:var(--gold)}
.bean--premium .bnote{background:rgba(192,154,44,.15);color:#6F5511}
.bean__lux{display:inline-block;margin-inline-end:.45rem;padding:.2rem .58rem;border-radius:999px;
  font-size:.66rem;font-weight:700;background:var(--gold);color:#2A2110;vertical-align:.2em}
.bspec--extra span{color:#6F5511;font-weight:700;font-family:var(--en-display);direction:ltr}
.bean__mono{position:absolute;top:1.1rem;right:1.15rem;width:20px;
  color:var(--ember);opacity:1}
.bean--decaf .bean__mono{color:var(--glacier)}
.bean__c{font-family:var(--en-display);font-size:.74rem;font-weight:600;letter-spacing:.02em;
  color:var(--ink);direction:ltr;text-align:left}
.bean__n{margin:.45rem 0 0;font-family:var(--ar-display);font-weight:700;
  font-size:1.3rem;line-height:1.25;padding-right:2rem}
html[lang="en"] .bean__n{font-family:var(--en-display);font-weight:600;letter-spacing:-.015em}
.bean__alt{margin:.2rem 0 0;font-family:var(--en-display);font-size:.82rem;
  color:var(--ink-40);direction:ltr}
html[lang="en"] .bean__alt{font-family:var(--ar-body);direction:rtl}
.bean__specs{margin-top:1.05rem;border-top:1px solid var(--line)}
.bspec{display:flex;justify-content:space-between;align-items:baseline;gap:.9rem;
  padding:.52rem 0;border-bottom:1px solid var(--line);font-size:.88rem}
.bspec b{font-weight:500;color:var(--ink-40);font-size:.8rem;white-space:nowrap}
.bspec span{text-align:end}
.bnotes{margin-top:1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.35rem}
.bnotes__k{font-size:.8rem;color:var(--ink-40);margin-inline-end:.2rem}
.bnote{font-size:.75rem;font-weight:500;padding:.3rem .62rem;border-radius:999px;
  background:rgba(241,91,39,.09);color:var(--ember)}
.bean--decaf .bnote{background:rgba(112,205,221,.18);color:#2a7f92}
.bean__tag{display:inline-block;margin-top:.9rem;align-self:flex-start;font-size:.68rem;
  font-weight:600;padding:.26rem .62rem;border-radius:999px;
  background:var(--glacier);color:var(--ink)}
@media (min-width:900px){
  .bean{width:320px;padding:1.6rem 1.4rem 1.4rem}
  .bean__n{font-size:1.45rem}
}

/* ================= القسم الداكن ================= */
.dark{background:var(--ink);color:var(--bone);margin-top:clamp(3.5rem,12vw,8rem);
  padding:clamp(3rem,10vw,6rem) 0;scroll-margin-top:60px}
.dark .sec__title{color:var(--bone)}
.dark .sec__count{color:var(--glacier)}
.dark .sec__line,.dark .item__desc{color:rgba(246,238,228,.62)}
.dark .kcal{color:rgba(246,238,228,.42)}
.dark .item__fig{background:#1e1e1e}
.dark .price{color:var(--glacier)}

/* ================= التذييل ================= */
footer{background:var(--ink);color:var(--bone);padding:clamp(2.4rem,8vw,4rem) var(--pad) 2.6rem;
  border-top:1px solid rgba(246,238,228,.13)}
.foot__logo{width:clamp(120px,30vw,180px);color:var(--bone);margin-bottom:1.8rem}
.foot__grid{display:grid;gap:1.5rem}
.foot__k{font-family:var(--en-display);font-size:.72rem;font-weight:600;letter-spacing:.02em;
  color:rgba(246,238,228,.42);margin:0 0 .35rem;direction:ltr}
.foot__v{margin:0;font-size:.98rem}
.foot__v a{color:var(--glacier);text-decoration:none;border-bottom:1px solid transparent;
  transition:border-color .25s}
.foot__handle{font-family:var(--en-display);font-weight:600;direction:ltr;margin-bottom:.15rem}
.foot__social{display:flex;align-items:center;gap:.5rem;font-size:.92rem}
.foot__sep{color:rgba(246,238,228,.32)}
.foot__v a:hover{border-color:var(--glacier)}
.hrs{margin:0;display:grid;gap:.3rem;font-size:.92rem}
.hrs div{display:flex;justify-content:space-between;gap:1rem;max-width:26rem;
  border-bottom:1px dotted rgba(246,238,228,.16);padding-bottom:.3rem}
.hrs b{font-weight:500;color:rgba(246,238,228,.66)}
.hrs span{font-family:var(--en-display);font-size:.82rem;direction:ltr;white-space:nowrap}
.hrs .now b,.hrs .now span{color:var(--glacier)}
.foot__end{margin-top:2.4rem;padding-top:1.3rem;border-top:1px solid rgba(246,238,228,.13);
  display:flex;align-items:center;justify-content:space-between;gap:1rem}
.foot__mono{width:22px;color:var(--ember);transition:transform .8s var(--swing)}
.foot__mono:hover{transform:rotate(180deg)}
.foot__fine{font-family:var(--en-display);font-size:.64rem;color:rgba(246,238,228,.36);direction:ltr}

@media (min-width:900px){
  .hero__word{width:min(38vw,470px)}
  .foot__grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:2rem}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .rv,.lift>span{opacity:1!important;transform:none!important;clip-path:none!important}
}

/* ===== لوحة موسمي بصنفين: بطاقتان متطابقتان بمقاس مضبوط ===== */
.sec--panel .grid-items:has(.item:nth-child(2):last-child){
  grid-template-columns:repeat(2,minmax(0,330px));
  gap:clamp(1rem,3.5vw,2.2rem);
  justify-content:center}
.sec--panel .grid-items:has(.item:nth-child(2):last-child) .item{width:100%}
/* الصور مربعة كمصدرها، فتظهر كاملة بلا قصّ وبنفس الارتفاع */
.sec--panel .grid-items:has(.item:nth-child(2):last-child) .item__fig{
  aspect-ratio:1}
.sec--panel .grid-items:has(.item:nth-child(2):last-child) .item__name{
  font-size:clamp(1.15rem,4.4vw,1.5rem);line-height:1.3}
.sec--panel .grid-items:has(.item:nth-child(2):last-child) .item__desc{
  font-size:.92rem;-webkit-line-clamp:3}
.sec--panel .grid-items:has(.item:nth-child(2):last-child) .price{
  font-size:clamp(1.15rem,4vw,1.45rem)}
/* الجوال: ارتفاعات محجوزة حتى تتحاذى البطاقتان سطراً بسطر */
@media (max-width:719px){
  .sec--panel .grid-items:has(.item:nth-child(2):last-child) .item__name{
    min-height:2.6em}
  .sec--panel .grid-items:has(.item:nth-child(2):last-child) .item__desc{
    -webkit-line-clamp:4;min-height:6em}
}
@media (min-width:720px){
  .sec--panel .grid-items:has(.item:nth-child(2):last-child){
    gap:clamp(2rem,4vw,3.2rem)}
  .sec--panel .grid-items:has(.item:nth-child(2):last-child) .item__desc{
    font-size:.98rem;min-height:3.3em}
}
</style>
</head>

/* ============================================================
   5) المحرّك
   ============================================================ */
let lang = "ar";
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CALM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CAN_ANIM = !CALM && typeof IntersectionObserver === "function";
if(CAN_ANIM) document.documentElement.classList.add("anim");

/* شبكة أمان: تعمل فقط إذا لم يستجب المراقب إطلاقاً خلال ثانيتين ونصف،
   حتى لا تُلغي حركة الكشف في الأقسام التي لم يصلها المستخدم بعد */
let ioFired = false;
function revealAll(){
  document.querySelectorAll(".rv,.lift").forEach(el=>el.classList.add("in"));
}
function armSafety(){
  setTimeout(revealAll, 2000);
}
armSafety();
/* اختيار النص حسب اللغة */
const nm  = o => lang==="ar" ? o.ar  : o.en;
const ds  = o => lang==="ar" ? o.dAr : o.dEn;
const ln  = o => lang==="ar" ? o.lAr : o.lEn;
const alt = o => lang==="ar" ? o.en  : o.ar;

function itemHTML(it, i){
  const name = nm(it);
  const desc = ds(it);
  const flag = it.flag ? `<span class="flag${it.flag.cool?" flag--cool":""}">${esc(nm(it.flag))}</span>` : "";
  const price = it.price!=null
    ? `<span class="price">${it.price}<i>${T[lang].cur}</i></span>`
    : `<span class="kcal">${esc(T[lang].ask)}</span>`;
  const kcal = it.kcal!=null ? `<span class="kcal">${it.kcal} ${esc(T[lang].kcal)}</span>` : "";
  const d = (i % 2) * 0.07;
  return `<article class="item${it.fit==="full"?" item--full":""}" data-id="${it.id}">
    <figure class="item__fig">
      <img src="${esc(IMG[it.img])}" alt="${esc(name)}" loading="lazy" decoding="async"
           width="${it.w||0}" height="${it.h||0}"
           style="object-position:${esc(it.focus || "50% 50%")}${
             it.fit==="full" && it.w ? `;aspect-ratio:${it.w}/${it.h}` : ""}">
    </figure>
    <div class="item__meta">
      <h3 class="item__name rv" style="--d:${d+0.1}s">${flag}${esc(name)}</h3>
      <p class="item__desc rv" style="--d:${d+0.15}s">${esc(desc)}</p>
      <div class="item__foot rv" style="--d:${d+0.2}s">${price}${kcal}</div>
    </div>
  </article>`;
}

function beansHTML(){
  const L = T[lang];
  const mono = document.querySelector(".rail__mono").innerHTML;
  const row = (label, val) => val ? `<div class="bspec"><b>${esc(label)}</b><span>${esc(val)}</span></div>` : "";
  return `<div class="beans">${BEANS.map((b,i)=>`
    <article class="bean rv${b.decaf?" bean--decaf":""}${b.premium?" bean--premium":""}" style="--d:${(i%3)*0.07}s">
      <span class="bean__mono" aria-hidden="true">${mono}</span>
      <span class="bean__c">${esc(nm(b.country))}</span>
      <h3 class="bean__n">${b.premium?`<span class="bean__lux">${esc(L.bLux)}</span>`:""}${esc(nm(b))}</h3>
      <p class="bean__alt">${esc(alt(b))}</p>
      <div class="bean__specs">
        ${row(L.bRegion, b.region && nm(b.region))}
        ${row(L.bHeight, b.height)}
        ${row(L.bProcess, b.process && nm(b.process))}
        ${row(L.bVariety, b.variety && nm(b.variety))}
        ${b.category ? row(L.bCategory, nm(b.category)) : ""}
        ${b.extra ? `<div class="bspec bspec--extra"><b>${esc(L.bExtra)}</b><span>+${b.extra} ${esc(L.cur)}</span></div>` : ""}
      </div>
      <div class="bnotes">
        <span class="bnotes__k">${esc(L.bNotes)}</span>
        ${b.notes.map(n=>`<span class="bnote">${esc(nm(n))}</span>`).join("")}
      </div>
      ${b.decaf ? `<span class="bean__tag">${esc(L.bDecaf)}</span>` : ""}
    </article>`).join("")}</div>`;
}

function drinksHTML(){

      <span>${esc(lang==="ar" ? h.t : (h.tEn || h.t))}</span></div>`;
  }).join("")}</div>`;

function render(){
  const doc = document.documentElement;
  doc.lang = lang; doc.dir = lang==="ar" ? "rtl" : "ltr";
  document.title = T[lang].doc + " | Malfa Coffee House";

  $('[data-t="cue"]').textContent = T[lang].cue;
  $("#heroCue").setAttribute("aria-label", T[lang].cue);

  $("#chips").innerHTML = `<span class="pillbg" id="pillbg"></span>` + CATS.map((c,i)=>
    `<button class="chip" data-go="${c.id}" aria-current="${i===0}">${esc(nm(c))}</button>`
  ).join("");

  $("#menu").innerHTML = CATS.map(c=>{
    const isD  = c.type === "drinks";
    const isB  = c.type === "beans";
    const items = (isD || isB) ? [] : MENU.filter(m=>m.cat===c.id);
    const line  = ln(c);
    const count = isD ? DRINKS.reduce((n,g)=>n+g.rows.length,0)
                : isB ? BEANS.length : items.length;
    const body  = isD ? drinksHTML()
      : isB ? beansHTML()
      : `<div class="grid-items">${items.map(itemHTML).join("")}</div>`;
    const head = c.hideHead ? "" : `<div class="sec__head">
        <div class="sec__row">
          <h2 class="sec__title"><span class="lift"><span>${esc(nm(c))}</span></span></h2>
          <span class="sec__count rv" style="--d:.2s">${count} ${esc(T[lang].items)}</span>
        </div>
        ${line ? `<p class="sec__line rv" style="--d:.14s">${esc(line)}</p>` : ""}
      </div>`;
    return `<section class="sec${c.dark?" dark":""}${c.hideHead?" sec--bare":""}${c.panel?" sec--panel":""}" id="${c.id}">${head}${body}</section>`;
  }).join("");

  const L = T[lang];
  $("#footGrid").innerHTML = `
    <div><p class="foot__k">${esc(L.fLoc)}</p>
      <p class="foot__v">${esc(SHOP.area[lang] || SHOP.area.en)}<br>
      <a href="${esc(SHOP.mapUrl)}" target="_blank" rel="noopener">${esc(L.fMap)}</a></p></div>
    <div><p class="foot__k">${esc(L.fIg)}</p>
      <p class="foot__v foot__handle">${esc(SHOP.instagram)}</p>
      <p class="foot__v foot__social">
        <a href="${esc(SHOP.instagramUrl)}" target="_blank" rel="noopener">${esc(L.fInsta)}</a>
        ${SHOP.tiktokUrl ? `<span class="foot__sep">·</span>
        <a href="${esc(SHOP.tiktokUrl)}" target="_blank" rel="noopener">${esc(L.fTik)}</a>` : ""}
      </p></div>
    <div><p class="foot__k">${esc(L.fHours)}</p>${hoursHTML()}</div>`;

  $("#lang").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.l===lang));
  wire();
  requestAnimationFrame(movePill);
  armSafety();
}

/* ---------- الكشف بالتمرير ---------- */
let revealIO;
function watchReveals(){
  if(!CAN_ANIM){ revealAll(); return; }
  if(revealIO) revealIO.disconnect();
  revealIO = new IntersectionObserver(es=>{
    ioFired = true;
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); revealIO.unobserve(e.target); }});
  },{rootMargin:"0px 0px -12% 0px", threshold:.06});
  $$(".rv,.sec .lift").forEach(el=>revealIO.observe(el));
}

/* ---------- بارالاكس + شريط التقدم ---------- */
let ticking = false;
function onScroll(){
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(()=>{
    const h = document.documentElement;
    const p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
    const prog = $("#prog");
    if(prog) prog.style.transform = `scaleX(${p.toFixed(4)})`;
    const hero = document.getElementById("top"), hm = $("#heroMark");
    if(hero && hm && !CALM){
      const travel = Math.max(1, hero.offsetHeight - innerHeight);
      const q = Math.min(1, Math.max(0, h.scrollTop / travel));
      hm.style.transform = `translateY(${(-34*q).toFixed(1)}px) scale(${(1-0.17*q).toFixed(3)})`;
      hm.style.opacity = Math.max(0, 1 - q*1.15).toFixed(3);
    }
    ticking = false;
  });
}

/* ---------- مؤشر الشريط ---------- */
function movePill(){
  const pill = $("#pillbg"), on = $('.chip[aria-current="true"]');
  if(!pill || !on) return;
  pill.style.width = on.offsetWidth + "px";
  pill.style.transform = `translateX(${on.offsetLeft}px)`;
}

/* ---------- الربط ---------- */
let secIO;
function wire(){
  const chips = $$(".chip");

  /* توسيط الشريحة داخل شريطها فقط — لا نلمس تمرير الصفحة إطلاقاً،
     لأن أي scrollIntoView ثانٍ يلغي التمرير الناعم الجاري */
  function centerChip(c){
    const box = $("#chips"); if(!box || !c) return;
    const to = c.offsetLeft - (box.clientWidth - c.offsetWidth)/2;
    if(box.scrollTo) box.scrollTo({left:Math.max(0,to), behavior: CALM ? "auto" : "smooth"});
    else box.scrollLeft = Math.max(0,to);
  }

  /* ننزل على بداية محتوى القسم فعلياً: نتخطى حشوته العلوية
     ونطرح ارتفاع الشريط اللاصق المقاس لحظياً */
  function goTo(id){
    const sec = document.getElementById(id); if(!sec) return;
    const rail = $("#rail");
    const railH = rail ? rail.offsetHeight : 56;
    const pad = parseFloat(getComputedStyle(sec).paddingTop) || 0;
    const y = sec.getBoundingClientRect().top + window.scrollY + pad - railH - 14;
    window.scrollTo({top:Math.max(0,y), behavior: CALM ? "auto" : "smooth"});
  }

  chips.forEach(c=>c.addEventListener("click", ()=>{
    const rail = $("#rail");
    rail.classList.add("moving");
    setTimeout(()=>rail.classList.remove("moving"), 750);
    chips.forEach(x=>x.setAttribute("aria-current", String(x===c)));
    movePill(); centerChip(c);
    goTo(c.dataset.go);
    const sec = document.getElementById(c.dataset.go);
    const t = sec && sec.querySelector(".lift");
    if(t && !CALM){ t.classList.remove("in"); setTimeout(()=>t.classList.add("in"), 470); }
  }));

  if(secIO) secIO.disconnect();
  secIO = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(!e.isIntersecting) return;
      chips.forEach(c=>c.setAttribute("aria-current", String(c.dataset.go===e.target.id)));
      centerChip(chips.find(x=>x.dataset.go===e.target.id));
      movePill();
    });
  },{rootMargin:"-45% 0px -50% 0px"});
  $$(".sec").forEach(s=>secIO.observe(s));

  watchReveals();
  onScroll();
}

$("#lang").addEventListener("click", e=>{
  const b = e.target.closest("button[data-l]");
  if(!b || b.dataset.l === lang) return;
  const next = b.dataset.l;
  const m = $("#menu");
  m.classList.add("swap");
  setTimeout(()=>{
    lang = next;
    render();
    m.classList.remove("swap");
  }, CALM ? 0 : 250);
});
$("#heroCue").addEventListener("click", ()=>{
  const first = document.querySelector(".sec");
  if(first) first.scrollIntoView({behavior: CALM ? "auto" : "smooth", block:"start"});
});
addEventListener("scroll", onScroll, {passive:true});
addEventListener("resize", ()=>{ movePill(); onScroll(); });
$("#chips").addEventListener("scroll", movePill, {passive:true});

$("#yr").textContent = new Date().getFullYear();
render();

addEventListener("load", ()=>{
  watchReveals(); onScroll(); movePill();
});
</script>
